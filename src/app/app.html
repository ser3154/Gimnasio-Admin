<header class="barra">
  <div class="barra__interior">
    <span class="barra__marca">
      <img src="/logo.svg" alt="Logo" />
      Gimnasio Titanes
    </span>
    <span class="barra__etiqueta">Admin</span>
  </div>
</header>

<main class="pagina">
  <div class="encabezado">
    <div>
      <h1>Tablero</h1>
      <p>Resumen de las clases del gimnasio</p>
    </div>
  </div>

  <section class="resumen">
    <div class="resumen__dato">
      <span class="resumen__numero">{{ total() }}</span>
      <span class="resumen__texto">Total de clases</span>
    </div>
    <div class="resumen__dato">
      <span class="resumen__numero">{{ minutosSemana() }}</span>
      <span class="resumen__texto">Minutos a la semana</span>
    </div>
    <div class="resumen__dato">
      <span class="resumen__numero">{{ largas() }}</span>
      <span class="resumen__texto">Clases de 1 hora o más</span>
    </div>
  </section>

  <div class="acciones">
    <button class="boton boton--peligro" (click)="vaciar()">Vaciar catálogo</button>
    <button class="boton boton--secundario" (click)="restaurar()">Restaurar catálogo</button>
  </div>

  <section class="rejilla" style="margin-top: 1rem">
    @for (clase of clases(); track clase.id) {
      <app-tarjeta-clase [clase]="clase" />
    } @empty {
      <p class="vacio">No hay clases en el catálogo.</p>
    }
  </section>
</main>
